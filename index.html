<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LiftLog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

  <div class="bg-gradient"></div>

  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <div class="logo-icon">🏋️</div>
        <div>
          <h1 class="logo-title">LiftLog</h1>
          <p class="logo-sub">Your personal training journal</p>
        </div>
      </div>
      <div class="header-date" id="headerDate"></div>
    </div>
  </header>

  <div class="container page">

    <!-- 1. KPI Row -->
    <section class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-icon-wrap kpi-purple">
          <i data-lucide="calendar-days" class="kpi-svg"></i>
        </div>
        <div class="kpi-label">Total Workouts</div>
        <div class="kpi-value" id="kpiWorkouts">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon-wrap kpi-orange">
          <i data-lucide="repeat-2" class="kpi-svg"></i>
        </div>
        <div class="kpi-label">Sets Completed</div>
        <div class="kpi-value" id="kpiSets">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon-wrap kpi-green">
          <i data-lucide="weight" class="kpi-svg"></i>
        </div>
        <div class="kpi-label">Total Volume</div>
        <div class="kpi-value" id="kpiWeight">0 kg</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon-wrap kpi-blue">
          <i data-lucide="zap" class="kpi-svg"></i>
        </div>
        <div class="kpi-label">Today's Exercises</div>
        <div class="kpi-value" id="kpiToday">0</div>
      </div>
    </section>

    <!-- 2. Add exercise -->
    <section class="card add-section">
      <div class="add-section-header" id="toggleForm">
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="card-icon">➕</span>
          <div>
            <div class="card-title">Add Exercise</div>
            <div class="card-desc">Log a new set</div>
          </div>
        </div>
        <span class="toggle-arrow" id="toggleArrow">▾</span>
      </div>

      <div class="form-body" id="formBody">
        <div class="form-divider"></div>

        <div class="form-field">
          <label class="label">Exercise Name</label>
          <input class="input" type="text" id="exercise" placeholder="e.g. Bench Press" />
        </div>

        <div class="form-row-3">
          <div class="form-field">
            <label class="label">Sets</label>
            <input class="input" type="number" id="sets" placeholder="3" min="1" />
          </div>
          <div class="form-field">
            <label class="label">Reps</label>
            <input class="input" type="number" id="reps" placeholder="10" min="1" />
          </div>
          <div class="form-field">
            <label class="label">Weight (kg)</label>
            <input class="input" type="number" id="weight" placeholder="50" min="0" />
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-field">
            <label class="label">How do you feel?</label>
            <select class="input" id="feeling">
              <option value="great">😄 Great</option>
              <option value="good" selected>🙂 Good</option>
              <option value="ok">😐 Okay</option>
              <option value="bad">😔 Bad</option>
            </select>
          </div>
          <div class="form-field">
            <label class="label">Notes <span class="label-opt">optional</span></label>
            <input class="input" type="text" id="notes" placeholder="Any comments..." />
          </div>
        </div>

        <button class="btn-primary" id="addBtn">+ Add Exercise</button>
      </div>
    </section>

    <!-- 3. History dashboard -->
    <section>
      <div class="section-heading">
        <h2 class="section-title">📅 Workout History</h2>
        <button class="btn-ghost-sm" id="clearAll">Clear all</button>
      </div>
      <div id="historyList"></div>
    </section>

  </div>

  <!-- Floating Timer -->
  <div class="timer-fab" id="timerFab">
    <button class="timer-fab-btn" id="timerToggle" title="Rest Timer">⏱</button>
  </div>

  <div class="timer-panel" id="timerPanel">
    <div class="timer-panel-header">
      <span class="timer-panel-title">⏱ Rest Timer</span>
      <button class="timer-close" id="timerClose">✕</button>
    </div>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="timer-presets">
      <button class="btn-outline" onclick="startTimer(60)">1 min</button>
      <button class="btn-outline" onclick="startTimer(90)">1:30</button>
      <button class="btn-outline" onclick="startTimer(120)">2 min</button>
      <button class="btn-outline" onclick="startTimer(180)">3 min</button>
    </div>
    <button class="btn-ghost-timer" onclick="stopTimer()">✕ Stop</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
